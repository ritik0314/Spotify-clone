<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Artists</title>
  <link rel="icon" type="image/jpeg" href="assets/lata mangeshkar.jpeg">
  <style>
    :root {
      --bg-main: #000;
      --bg-surface: #121212;
      --bg-card: #1a1a1a;
      --bg-hover: #262626;
      --text-main: #fff;
      --text-muted: #b3b3b3;
      --accent: #1db954;
      --border: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #1a1a1a 0%, #070707 34%, #000 72%);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px 14px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .title p {
      color: var(--text-muted);
      font-size: 12px;
    }

    .title h1 {
      font-size: 28px;
      line-height: 1.2;
    }

    .back-link {
      text-decoration: none;
      color: #000;
      background: var(--accent);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      background: var(--bg-hover);
      transform: translateY(-2px);
    }

    .card img {
      width: 74%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 2px auto 10px;
      border: 1px solid var(--border);
    }

    .card h3 {
      font-size: 15px;
      margin-bottom: 2px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .container { padding: 14px; }
      .title h1 { font-size: 24px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 420px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title">
        <p>Browse</p>
        <h1>All Artists</h1>
      </div>
      <a class="back-link" href="index.html">Back to Home</a>
    </div>

    <div class="grid">
      <a class="card" href="artist.html?artist=jagjit"><img src="assets/Jagjit Singh.jpeg" alt="Jagjit Singh"><h3>Jagjit Singh</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=lata"><img src="assets/lata mangeshkar.jpeg" alt="Lata Mangeshkar"><h3>Lata Mangeshkar</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=kishore"><img src="assets/kishore kumar.jpeg" alt="Kishore Kumar"><h3>Kishore Kumar</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=atif"><img src="assets/atif aslam.jpeg" alt="Atif Aslam"><h3>Atif Aslam</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=arijit"><img src="assets/arijit singh.jpeg" alt="Arijit Singh"><h3>Arijit Singh</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=nusrat"><img src="assets/nusrat fateh ali khan.jpeg" alt="Nusrat Fateh Ali Khan"><h3>Nusrat Fateh Ali Khan</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=rehman"><img src="assets/A.R. Rehman.jpeg" alt="A.R Rehman"><h3>A.R Rehman</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=siddhu"><img src="assets/Sidhu Moose wala.jpeg" alt="Sidhu Moose wala"><h3>Sidhu Moose wala</h3><p>Artist</p></a>
      <a class="card" href="artist.html?artist=udit"><img src="assets/Udit Narayan.jpeg" alt="Udit Narayan"><h3>Udit Narayan</h3><p>Artist</p></a>
    </div>
  </div>
</body>
</html>
