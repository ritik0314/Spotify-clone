<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="artist.css">
    <link rel="icon" type="image/jpeg" href="assets/lata mangeshkar.jpeg">
    <title>Artist Playlist</title>
</head>
<body>
    <div class="songplaylist">
        <div class="introduction">
            <img id="introImage" src="" alt="Artist">
            <div class="heading">
                <h4>Public Playlist</h4>
                <h1 id="playlistTitle"></h1>
                <h4 id="playlistSubtitle"></h4>
                <h4 id="playlistMeta"></h4>
                <h4 id="artistFact"></h4>
            </div>
        </div>
    </div>
    <div class="songItem">
        <div class="songname">
            <div class="songheading">
                <div class="serialnumber">#</div>
                <div class="Title">Title</div>
                <div class="duration">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>
            <div id="songsContainer"></div>
        </div>
    </div>

    <div class="bottom">
        <div class="alignsongplay">
            <div class="icons">
                <i class="fa-2x fa-solid fa-backward-step" id="backwardStep"></i>
                <i class="fa-2x fa-regular fa-circle-play" id="masterPlay"></i>
                <i class="fa-2x fa-solid fa-forward-step" id="forwardStep"></i>
            </div>
            <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        </div>
    </div>
    <script src="https://kit.fontawesome.com/1553337e33.js" crossorigin="anonymous"></script>
    <script src="artist.js"></script>
</body>
</html>
